services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64          # Microsoft only publishes amd64; runs via Rosetta on Apple Silicon
    container_name: greenhouse-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Runs the Python pipeline. Used with: docker compose run --rm app python <script>
  app:
    build: .
    image: greenhouse-dq-pipeline
    profiles: ["tools"]            # not started by "docker compose up"; only when run explicitly
    env_file: .env
    environment:
      SQL_SERVER: "sqlserver,1433" # reach SQL Server by its service name on the Docker network
    volumes:
      - .:/app
    depends_on:
      sqlserver:
        condition: service_healthy

  # Data health dashboard on http://localhost:8501. Started with: make dashboard
  dashboard:
    build: .
    image: greenhouse-dq-pipeline
    profiles: ["tools"]
    env_file: .env
    environment:
      SQL_SERVER: "sqlserver,1433"
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0",
              "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqldata:
